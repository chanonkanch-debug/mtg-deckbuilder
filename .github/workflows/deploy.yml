name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, to pick up new MTGO tournament decklists for Build around.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Event pages never change once published, so they're cached between runs and only new ones are fetched.
      - uses: actions/cache@v4
        with:
          path: .decklist-cache
          key: decklists-${{ github.run_id }}
          restore-keys: decklists-
      # If mtgo.com is down or has changed, the site still deploys, just without fresh decklists.
      - run: node scripts/collect-decklists.mjs
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
