name: Probe MTGO
on:
  push:
    branches: [probe-mtgo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          exec > probe.txt 2>&1
          date; timeout 1500 node scripts/collect-decklists.mjs 14; echo exit $?; date
          ls -la public/decks || true
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -f probe.txt; git add -f public/decks || true; git commit -m "probe output [skip ci]"; git push
        if: always()
