name: Probe MTGO
on:
  push:
    branches: [probe-mtgo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          exec > probe.txt 2>&1
          for u in /decklist/standard-league-2026-10-2211129 /decklist/modern-challenge-32-2026-10-2112856954; do curl -sS -o /dev/null -A "Mozilla/5.0" -w "curl $u %{http_code} %{size_download} %{time_total}s\n" https://www.mtgo.com$u; done
          node probe-speed.mjs
          ls -la public/decks || true
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -f probe.txt; git add -f public/decks || true; git commit -m "probe output [skip ci]"; git push
        if: always()
