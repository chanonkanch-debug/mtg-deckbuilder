name: Probe MTGO
on:
  push:
    branches: [probe-mtgo]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          exec > probe.txt 2>&1
          for i in 1 2 3; do for u in /decklist/standard-league-2026-10-2211129 /decklist/legacy-challenge-32-2026-10-2112856954; do curl -sS -D - -o p$i.html -A "Mozilla/5.0" https://www.mtgo.com$u | grep -i "^HTTP\|^location\|^set-cookie" ; done; done
          curl -sSL -A "Mozilla/5.0" -c jar -b jar https://www.mtgo.com/decklist/legacy-challenge-32-2026-10-2112856954 -o a.html -w "cookie-jar %{http_code} %{size_download} %{url_effective}\n"
          curl -sSL -A "Mozilla/5.0" -c jar -b jar https://www.mtgo.com/decklist/standard-league-2026-10-2211129 -o b.html -w "cookie-jar %{http_code} %{size_download} %{url_effective}\n"
          grep -o "<title>[^<]*" a.html b.html; grep -c "decklists.data" a.html b.html
          ls -la public/decks || true
      - run: |
          git config user.name probe; git config user.email probe@example.com
          git add -f probe.txt; git add -f public/decks || true; git commit -m "probe output [skip ci]"; git push
        if: always()
